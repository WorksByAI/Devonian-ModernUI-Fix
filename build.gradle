plugins { id 'net.fabricmc.fabric-loom' version '1.16.3' }

version = '1.0.1+26.1.2'
group = 'dev.devonianmodernuifix'
base { archivesName = 'devonian-modernui-fix' }

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar { from('LICENSE') }
sourcesJar { from('LICENSE') }
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn 'jar'
    systemProperty 'fix.binaryJar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'fix.projectDir', projectDir.absolutePath
}
